# Default configuration for AI Research Assistant for Obsidian
# Override any value in config/user.yaml (created by: ai-research-assistant setup)

# Obsidian vault
vault:
  path: null  # Required — set during setup

# Vault folder paths (relative to vault root)
folders:
  youtube: "Clippings/Youtube extractions"
  podcast: "Clippings/Podcast extractions"
  article: "Clippings/Article extractions"
  knowledge_base: "Knowledge Base"
  daily_notes: "Daily Notes"
  clippings: "Clippings"
  templates: "Templates"
  kb_fallback: "Misc"  # Knowledge-base subfolder used when the model names an unsafe folder

# Interest profile
profile:
  interest_profile: "interest-profile.md"

# Processing timeouts (seconds)
processing:
  article_timeout: 300
  youtube_timeout: 300
  podcast_timeout: 600
  evaluate_batch_size: 6
  evaluate_timeout: 600
  # Scheduled run limits
  max_entry_age_days: 14  # New entries older than this are skipped
  max_run_minutes: 60     # Stop starting new entries after this

# LLM analysis (Melious, OpenAI-compatible API)
llm:
  base_url: "https://api.melious.ai/v1"
  model: "deepseek-v4.1-flash"
  keychain_service: "melious-api-key"  # Fallback when MELIOUS_API_KEY is not in env or .env
  timeout_seconds: 180
  max_retries: 2
  max_output_tokens: 8000
  reasoning_effort: null  # null = model default (reasoning on); "none" turns it off
  output_language: "English"
  price_input_per_mtok: 0.20         # EUR
  price_cached_input_per_mtok: 0.01  # EUR
  price_output_per_mtok: 1.00        # EUR
  max_cost_per_run_eur: 2.00

# Article extraction
extraction:
  min_words: 150    # Below this, an article counts as not extractable
  max_words: 30000  # Longer text is cut before analysis

# Retry settings
retry:
  max_attempts: 4
  backoff_hours: [1, 4, 12, 24]

# Feed polling
feeds:
  request_timeout: 30
  user_agent: "AI-Research-Assistant/1.0"

# Schedule (for launchd plist generation)
schedule:
  hour: 6
  minute: 0
